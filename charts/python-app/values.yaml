
replicaCount: 2

image:
  repository: kwameds/python-app
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 5000

service:
  type: ClusterIP
  port: 5000

healthCheckPath: /api/v1/healthz

# Environment variables for the container, stored in a ConfigMap and loaded with envFrom.
# Leave empty ({}) to skip the ConfigMap. Values are always rendered as strings.
env:
  APP_ENV: dev
  LOG_LEVEL: info

httpRoute:
  enabled: true
  gateway:
    name: web
    namespace: default
  # Hostnames matching HTTP header.
  hostnames:
    - python-app.test.com
  pathPrefix: /
  # Host port that reaches the Gateway (k3d: -p "8081:80@loadbalancer"). Only used in NOTES.txt.
  externalPort: 8081
tls: []
resources:
  requests:
    cpu: 50m
    memory: 50M
livenessProbe:
  httpGet:
    path: /api/v1/healthz
    port: http
readinessProbe:
  httpGet:
    path: /api/v1/healthz
    port: http
# When enabled, the HPA owns the replica count and replicaCount is ignored.
# Requires resources.requests.cpu (and metrics-server, which k3s ships).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}


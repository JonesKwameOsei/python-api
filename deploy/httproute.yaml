apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: python-app
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: web
      namespace: default
  hostnames:
    - python-app.test.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
      - name: python-app
        port: 8080
